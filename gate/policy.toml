# what the gate weighs before promoting a candidate over the serving model.
# gains and losses are in accuracy, and a promoted model serves for as long
# whether it turned out better or worse, so that time cancels out.

# how much worse a point of accuracy lost is than a point gained. at 1 the gate
# promotes on any positive expected gain; above 1 it wants more evidence the
# more a loss is plausible. a regression reaches users who notice, a gain of
# the same size mostly doesn't, hence more than 1.
penalty = 4.0

# steps the candidate shadows the model in service before the gate looks,
# once. it is judged on the rows served meanwhile as well as its held-out ones,
# with the labels back by then, and a better candidate waits that long to serve.
shadow = 10

# with fewer labeled rows than this the gate holds whatever they say
min_rows = 100

# a class with at least class_rows held-out labels holds the promotion when
# its recall falls by more than tolerance with class_confidence at least,
# whatever the overall gain. on a few dozen rows a recall swings by more than
# the tolerance for nothing, so the drop has to stand out from that first. the
# rarest class seldom has class_rows, so a loss there goes unseen.
class_rows = 20
tolerance = 0.05
class_confidence = 0.95

# after a candidate is kept back, or the trigger holds, the model in service
# is watched again this many steps later, twice as late each further time
retry = 50
